name: Build & Package iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration (Release / Debug)'
        required: true
        default: 'Release'

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "==> Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            XCODE_DIR="/Applications/Xcode_16.2.app"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            XCODE_DIR="/Applications/Xcode_16.1.app"
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            XCODE_DIR="/Applications/Xcode_16.0.app"
          else
            XCODE_DIR="/Applications/Xcode.app"
          fi
          echo "==> Activating Xcode: $XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_DIR/Contents/Developer" >> $GITHUB_ENV
          export DEVELOPER_DIR="$XCODE_DIR/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          echo "==> Installing XcodeGen via Homebrew..."
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          echo "==> Generating TradeJournal.xcodeproj from project.yml..."
          xcodegen generate
          ls -la TradeJournal.xcodeproj

      - name: Inspect Xcode Project
        id: inspect_project
        run: |
          mkdir -p build
          set -o pipefail
          echo "==> Listing targets and schemes:"
          xcodebuild -list -project TradeJournal.xcodeproj 2>&1 | tee build/list.log

      - name: Report Inspect Error via Workflow Annotation
        if: failure() && steps.inspect_project.outcome == 'failure'
        run: |
          cat build/list.log || true
          ERROR_MSG=$(cat build/list.log | head -n 5 | tr '\n' ' ' | cut -c 1-250)
          echo "::error title=XcodeListError::$ERROR_MSG"

      - name: Build iOS App Binary
        id: build_app
        run: |
          echo "==> Building Release Binary for iOS..."
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          mkdir -p build
          set -o pipefail
          xcodebuild build \
            -project TradeJournal.xcodeproj \
            -scheme TradeJournal \
            -destination "generic/platform=iOS" \
            -configuration "$CONFIG" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build/xcodebuild.log

      - name: Report Build Error via Workflow Annotation
        if: failure() && steps.build_app.outcome == 'failure'
        run: |
          echo "==> Full build log:"
          cat build/xcodebuild.log || true
          ERROR_SUMMARY=$(grep -E -i "(error:|fatal error:)" build/xcodebuild.log | head -n 3 | tr '\n' ' ' | cut -c 1-250)
          if [ -z "$ERROR_SUMMARY" ]; then
            ERROR_SUMMARY=$(tail -n 10 build/xcodebuild.log | tr '\n' ' ' | cut -c 1-250)
          fi
          echo "::error title=XcodeBuildError::$ERROR_SUMMARY"

      - name: Package IPA
        run: |
          echo "==> Packaging .app into .ipa..."
          rm -rf build/Payload build/TradeJournal.ipa
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "TradeJournal.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "TradeJournal.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::TradeJournal.app not found in build/DerivedData"
            exit 1
          fi
          echo "==> Normalizing bundle permissions and stripping extended attributes..."
          xattr -cr "$APP_PATH" || true
          chmod -R 755 "$APP_PATH" || true
          echo "==> Cleaning stale signatures..."
          rm -rf "$APP_PATH/_CodeSignature" || true
          echo "==> Applying clean ad-hoc signature..."
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -9 -y -X TradeJournal.ipa Payload
          ls -lh TradeJournal.ipa
          shasum -a 256 TradeJournal.ipa > TradeJournal.ipa.sha256
          echo "SHA256 Checksum:"
          cat TradeJournal.ipa.sha256

      - name: Verify IPA Integrity & Report Bundle Structure
        run: |
          echo "### 📦 IPA Bundle Inspection" >> $GITHUB_STEP_SUMMARY
          echo "#### Info.plist Contents:" >> $GITHUB_STEP_SUMMARY
          echo '```xml' >> $GITHUB_STEP_SUMMARY
          plutil -p "build/Payload/TradeJournal.app/Info.plist" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "#### Mach-O Binary & Dylib Dependencies:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          file "build/Payload/TradeJournal.app/TradeJournal" >> $GITHUB_STEP_SUMMARY
          otool -L "build/Payload/TradeJournal.app/TradeJournal" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "#### Codesign Status:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          codesign -dvvv "build/Payload/TradeJournal.app" 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "#### Zip Archive Tree:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          unzip -l build/TradeJournal.ipa >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeJournal-iOS-IPA
          path: |
            build/TradeJournal.ipa
            build/TradeJournal.ipa.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/TradeJournal.ipa
            build/TradeJournal.ipa.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

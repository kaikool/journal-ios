name: TradeJournal
options:
  bundleIdPrefix: com.tradejournal
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: "com.tradejournal.app"
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "1.0.1"
    CODE_SIGN_STYLE: "Manual"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"

targets:
  TradeJournal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TradeJournal/Sources
    settings:
      base:
        PRODUCT_NAME: "TradeJournal"
        INFOPLIST_KEY_CFBundleDisplayName: "Trade Journal"
        INFOPLIST_KEY_CFBundleIdentifier: "com.tradejournal.app"
        INFOPLIST_KEY_CFBundleVersion: "3"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.1"
        INFOPLIST_KEY_CFBundlePackageType: "APPL"
        INFOPLIST_KEY_LSRequiresIPhoneOS: "YES"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_BITCODE: "NO"

schemes:
  TradeJournal:
    build:
      targets:
        TradeJournal: all
